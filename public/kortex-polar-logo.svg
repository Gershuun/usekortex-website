<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Kortex</title>
  <desc id="desc">A geometric white K on a deep navy field with a coral and mint gradient glow.</desc>
  <defs>
    <linearGradient id="surface" x1="120" y1="80" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1526"/>
      <stop offset="0.55" stop-color="#142B42"/>
      <stop offset="1" stop-color="#09121F"/>
    </linearGradient>
    <linearGradient id="accent" x1="220" y1="820" x2="820" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D5C2"/>
      <stop offset="0.48" stop-color="#F4B740"/>
      <stop offset="1" stop-color="#FF6B55"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(770 230) rotate(125) scale(430)">
      <stop stop-color="#FF765F" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#FF765F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 830) rotate(-35) scale(400)">
      <stop stop-color="#35D5C2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#35D5C2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#B7D4E8" stroke-opacity="0.06" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020711" flood-opacity="0.46"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="#060D18"/>
  <rect x="42" y="42" width="940" height="940" rx="190" fill="url(#surface)" stroke="#29445E" stroke-width="8"/>
  <rect x="78" y="78" width="868" height="868" rx="160" fill="url(#grid)"/>
  <circle cx="770" cy="230" r="430" fill="url(#coralGlow)"/>
  <circle cx="200" cy="830" r="400" fill="url(#mintGlow)"/>

  <path d="M132 738C282 868 483 878 655 780C761 720 832 634 892 514" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="14" opacity="0.9"/>
  <path d="M168 264C315 152 512 134 682 206C768 242 834 300 884 374" fill="none" stroke="#D7F2EE" stroke-linecap="round" stroke-width="5" opacity="0.2"/>
  <circle cx="887" cy="378" r="12" fill="#35D5C2"/>
  <circle cx="132" cy="738" r="10" fill="#FF6B55"/>

  <g filter="url(#shadow)">
    <path d="M264 224H424V446L650 224H838L570 505L846 800H650L424 570V800H264V224Z" fill="#F7FBFC"/>
    <path d="M424 446L650 224H838L570 505L424 570V446Z" fill="url(#accent)" opacity="0.95"/>
    <path d="M424 570L650 800H846L570 505L424 446V570Z" fill="#DCEAF0" opacity="0.9"/>
    <path d="M424 446L650 224H720L496 492L424 570V446Z" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <circle cx="512" cy="512" r="414" fill="none" stroke="#EAF8F5" stroke-opacity="0.1" stroke-width="3"/>
</svg>
